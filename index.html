['在家也可以','找一種柔軟','碰一碰舒服的布料、枕頭或袖口，留意觸感。不喜歡就換一個。'],['在家也可以','看一小片天空','走到窗邊，找出天空裡兩種不同的顏色。坐著看也很好。'],['在家也可以','把眼前變簡單','只整理手邊一個物品的位置，然後就可以停下。'],['在家也可以','留一盞舒服的燈','調整一盞燈或拉動窗簾，找出此刻舒服的亮度。'],['在家也可以','畫一條沒有目的的線','在紙上慢慢畫線，不必像任何東西。'],['在家也可以','給自己一點支撐','把枕頭放在背後或腿上，找到不用太費力的姿勢。'],['在家也可以','聽完一小段歌','選自己熟悉的歌，音量舒服就好。沒有必要聽完。'],['在家也可以','寫一句真實的話','用「我現在需要……」開頭，不用解釋原因。'],['出去走走','找一片葉子的影子','挑一段熟悉的短路線。找到葉子或影子，安全停下來拍一張。'],['出去走走','收集一種綠色','到附近找一個綠色的東西，不必走遠，也不必採摘。'],['出去走走','找一朵像心情的雲','在安全、沒有車流的位置看天空。如果沒有雲，就拍一種天空的顏色。'],['出去走走','看看光落在哪裡','出門找一小塊陽光或燈光，拍下它照著的地方。不要直視太陽。'],['出去走走','找一個圓形','在熟悉的街道找一個圓形。避開車道，停穩再拍。'],['出去走走','走到最近的一棵樹','不需要走很遠。在人行道或公園看一眼樹葉，有力氣再拍照。'],['出去走走','拍一個安靜的角落','找一個你喜歡的小地方；避免拍到陌生人的臉和私人空間。'],['出去走走','找一個今天才注意到的細節','可能是牆面紋路、花盆或門上的顏色。也可以只走到門口。'],['力氣很少','喝一小口水','水在旁邊的話，喝一口。沒有的話，也可以先舒服地坐著。'],['力氣很少','把手放下','把手機放在有支撐的位置，讓手指休息十秒。'],['力氣很少','只看一樣東西','選眼前一樣不會讓你不舒服的物品，留意它的顏色。'],['力氣很少','傳一句求陪伴的話','可以寫：「我今天有點難受，你有空陪我聊一下嗎？」不用自己想完整句子。'],['力氣很少','允許今天先暫停','把非必要的一件事延後。現在不必證明自己有多努力。']];let filter='全部',currentMethod=-1,photoURL=null;document.querySelector('#filters').innerHTML=['全部','力氣很少','在家也可以','出去走走'].map(t=>'<button class="chip '+(t==='全部'?'active':'')+'" data-filter="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));drawMethod()});function drawMethod(){let pool=methods.map((m,i)=>i).filter(i=>(filter==='全部'||methods[i][0]===filter)&&i!==currentMethod);currentMethod=pool[Math.floor(Math.random()*pool.length)];let m=methods[currentMethod];document.querySelector('#missiontype').textContent=m[0];document.querySelector('#missiontitle').textContent=m[1];document.querySelector('#missiondesc').textContent=m[2];document.querySelector('#photoLabel').style.display=m[0]==='出去走走'?'inline-block':'none';document.querySelector('#photopreview').style.display='none';document.querySelector('#missionstatus').textContent=m[0]==='出去走走'?'注意 lientRect();dot.style.left=Math.max(0,Math.min(r.width-40,e.clientX-r.left-20))+'px';dot.style.top=Math.max(0,Math.min(r.height-40,e.clientY-r.top-20))+'px'};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>{dot.style.left=(10+Math.random()*65)+'%';dot.style.top=(10+Math.random()*60)+'%'},3500)}if(k==='stretch')view('溫和的坐姿伸展','<p>選穩固的椅子，雙腳有支撐。任何疼痛、暈眩或不舒服都先停止。</p><ol><li>坐得舒服，手掌放腿上，自然呼吸。</li><li>吸氣時，輕輕讓胸口展開一點；吐氣時回到原本姿勢，重複兩次。</li><li>如果肩膀舒服，雙手慢慢往前伸，再放回腿上。</li><li>腳趾輕輕張開，再放鬆。</li></ol><p>不必做到極限，也不用配合固定速度。今天坐好休息也可以。</p>');if(k==='alternate')view('讓注意力，左右輕輕換邊','<p>這是自然呼吸的注意力練習，不是需要閉氣或控制鼻孔的交替鼻孔呼吸。</p><div class="orb">左手 · 右手</div><ol><li>雙手放在腿上，照平常的方式呼吸。</li><li>一次呼吸時，留意左手接觸腿的感覺。</li><li>下一次呼吸時，換成留意右手。</li><li>做兩三次就好，隨時回到平常呼吸。</li></ol><p class="notice">若注意呼吸讓你更不舒服，可以改看周圍物品的顏色。</p>');if(k==='rescue'){view('快速著陸','<p>坐好，雙腳踩地。</p><ol><li>感覺腳底碰著地面。</li><li>看看周圍，找出三樣你看得到的東西。</li><li>照平常的方式呼吸，鬆開下巴。</li></ol><button class="primary" onclick="openTool(\'ground\')">開始 54321</button><p class="notice">如果現在的環境不安全，請先移到安全的地方，聯絡身邊可信任的人；有立即危險時請聯絡當地緊急服務。</p>')}if(k==='breath'){view('呼吸練習','<p>隨圓圈吸氣、吐氣。不憋氣；不舒服就停止。</p><div class="orb breathe" id="breathlabel">輕輕吸氣</div><p style="text-align:center" id="breathcount">關閉即可停止。</p>');let s=0;timer=setInterval(()=>{s++;$('#breathlabel').textContent=s%9<4?'輕輕吸氣':'慢慢吐氣';if(s>=60){stop();$('#breathlabel').classList.remove('breathe');$('#breathlabel').textContent='完成';$('#breathcount').textContent='回到自然的呼吸。'}},1000)}if(k==='ground')ground();if(k==='body')view('鬆開練習','<p>坐好，有不適就略過。</p><ol><li>讓牙齒分開一點，鬆開下巴。</li><li>肩膀輕輕放下，不必用力往下壓。</li><li>張開手掌，再把手放在腿上。</li><li>感覺椅子承接身體的重量。</li><li>看看遠處，再回到自然呼吸。</li></ol>');if(k==='thought')view('整理思緒','<label>目前的念頭</label><textarea placeholder="暫存文字，關閉後不保留。"></textarea><p>在句子前面加上：「我注意到，我正在想……」</p><p>接下來十分鐘，能做的一件事是什麼？</p>');if(k==='kind'){view('一句話','<div class="quote" id="kindword" style="margin:22px 0"></div><button class="secondary" onclick="kind()">換一句</button>');kind()}if(k==='care')v const prompts=['看看周圍，找出 5 樣看得到的東西。','感覺 4 種接觸的感覺，例如腳底的地板、衣服的布料。','留意 3 種聽得到的聲音。沒有也可以略過。','留意 2 種聞得到的氣味。不必刻意尋找。','留意 1 種口中的味道，或喝一小口水。','你走到這裡了。看看周圍，說出自己現在所在的地方。'];function ground(){view('54321 著陸','<div class="steps">'+prompts.map((_,i)=>'<span class="'+(i<=step?'done':'')+'"></span>').join('')+'</div><p style="font-size:21px;min-height:100px">'+prompts[step]+'</p><p class="notice">依提示練習，可略過。</p>'+(step<5?'<button class="primary" onclick="step++;ground()">繼續／略過這一步 →</button>':'<button class="primary" onclick="document.querySelector(\'#modal\').close()">完成</button>'))}let last=-1;function kind(){let words=['你不需要把每一天都過得很厲害。','現在感到辛苦，不代表你做得不夠好。','有些事情可以晚一點再想，包含對自己的評價。','你可以需要別人，也可以開口說需要陪伴。','不必馬上找到答案，先讓自己舒服一點。','今天的力氣少一點，就用少一點的力氣生活。'];last=(last+1)%words.length;$('#kindword').textContent=words[last]}function sound(){if(noise){stop();$('#play').textContent='播放沙沙聲';return}try{ctx=new(window.AudioContext||window.webkitAudioContext)();let b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);let prev=0;for(let i=0;i<d.length;i++){prev=(prev+Math.random()*.04-.02)/1.02;d[i]=prev*3}noise=ctx.createBufferSource();noise.buffer=b;noise.loop=true;let g=ctx.createGain();g.gain.value=+$('#volume').value;$('#volume').oninput=e=>g.gain.setTargetAtTime(+e.target.value,ctx.currentTime,.1);noise.connect(g).connect(ctx.destination);noise.start();ctx.resume();$('#play').textContent='停止播放'}catch{$('#play').textContent='目前無法播放'}}function rest(){let left=180;$('#startrest').disabled=true;$('#startrest').textContent='計時中';let end=Date.now()+180000;timer=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left){stop();$('#clock').textContent='完成';$('#startrest').textContent='完成'}},500)}

function applyLineIcons(){let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[],n;while(n=walker.nextNode()){if(!['SCRIPT','STYLE'].includes(n.parentElement.tagName)&&!n.parentElement.closest('svg,textarea,input')&&Array.from(n.textContent).some(c=>lineIcons[c]))nodes.push(n)}for(let node of nodes){let frag=document.createDocumentFragment();for(let c of Array.from(node.textContent)){if(lineIcons[c]){let holder=document.createElement('span');holder.innerHTML=`<svg class="line-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${lineIcons[c]}<\/svg>`;frag.append(holder.firstChild)}else frag.append(document.createTextNode(c))}node.replaceWith(frag)}}applyLineIcons();new MutationObserver(applyLineIcons).observe(document.body,{childList:true,subtree:true,characterData:true});
